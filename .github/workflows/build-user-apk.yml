name: Build PromptGo User APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptgo-user-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
          test -s lib/20261026_230726.png
          echo "Required Flutter project and launcher icon files are present."

      - name: Generate Android platform files
        run: |
          flutter create \
            --platforms=android \
            --org com.promptgo \
            --project-name prompt_go \
            --no-pub .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify generated launcher icons
        run: |
          test -d android/app/src/main/res/mipmap-hdpi
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "Android launcher icons generated successfully."

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptGo-User-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Build PromptGo User APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptgo-user-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required project files
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
          test -s lib/20261026_230726.png
          test -s test/widget_test.dart
          echo "All required PromptGo User source files are present."

      - name: Generate Android platform project
        run: |
          flutter create \
            --platforms=android \
            --org com.admin \
            --project-name promptgo \
            --no-pub .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify launcher icon output
        run: |
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "Launcher icons generated."

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Build optimized release APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols \
            --tree-shake-icons

      - name: Verify all APK outputs
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          test -s "$APK_DIR/app-armeabi-v7a-release.apk"
          test -s "$APK_DIR/app-arm64-v8a-release.apk"
          test -s "$APK_DIR/app-x86_64-release.apk"
          ls -lh "$APK_DIR"/*.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: PromptGo-User-APK
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14

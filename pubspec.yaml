name: prompt_go
description: A premium AI prompt discovery app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/20261026_230726.png"
  min_sdk_android: 24
  adaptive_icon_background: "#080A12"
  adaptive_icon_foreground: "lib/20261026_230726.png"
